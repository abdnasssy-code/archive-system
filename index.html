<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الأرشيف والمراسلات الإدارية</title>
    <!-- استيراد خطوط وتصميم أنيق Bootstrap & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #1e293b; color: #fff; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .login-container { max-width: 400px; margin: 80px auto; padding: 20px; }
        .current-date { font-size: 0.95rem; color: #cbd5e1; }
    </style>
</head>
<body>

    <!-- شريط التنقل العلوي مع عرض التاريخ -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-archive ms-2"></i> نظام الأرشيف الرقمي</a>
            <div id="dateDisplay" class="current-date"></div>
        </div>
    </nav>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="login-container">
        <div class="card shadow-sm p-4">
            <h4 class="text-center mb-4 text-dark"><i class="fas fa-user-lock ms-2"></i> تسجـيل الدخـول</h4>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">دخول</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم والأرشيف (تظهر بعد تسجيل الدخول) -->
    <div id="dashboardSection" class="container py-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>لوحة إدارة المراسلات والأرشيف</h3>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt ms-1"></i> تسجيل الخروج</button>
        </div>

        <!-- نموذج إضافة معاملة جديدة -->
        <div class="card p-4 mb-4">
            <h5 class="mb-3 text-secondary"><i class="fas fa-plus-circle ms-1"></i> إضافة معاملة جديدة</h5>
            <form id="mailForm" onsubmit="addMail(event)">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">رقم الكتاب / المعاملة</label>
                        <input type="text" name="mail_number" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">نوع البريد / المعاملة</label>
                        <select name="mail_type" class="form-select" required>
                            <option value="صادر">صادر</option>
                            <option value="وارد">وارد</option>
                            <option value="داخلي">داخلي</option>
                            <option value="شكوى للرقابة">شكوى للرقابة</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">إشارة إلى (رد على)</label>
                        <input type="text" name="reply_to" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">درجة السرية</label>
                        <select name="secrecy_level" class="form-select">
                            <option value="عادي">عادي</option>
                            <option value="مكتوم">مكتوم</option>
                            <option value="سري">سري</option>
                            <option value="سري للغاية">سري للغاية</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">الجهة المرسلة</label>
                        <input type="text" name="sender_dept" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">الجهة المستلمة</label>
                        <input type="text" name="receiver_dept" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">موضوع الكتاب</label>
                        <input type="text" name="subject" class="form-control" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">الخلاصة / النص</label>
                        <textarea name="summary" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">إرفاق ملف PDF</label>
                        <input type="file" name="pdf_file" class="form-control" accept="application/pdf">
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100"><i class="fas fa-save ms-1"></i> حفظ وتوثيق المعاملة</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- جدول عرض الأرشيف -->
        <div class="card p-3">
            <h5 class="mb-3 text-secondary">سجل المعاملات والأرشيف</h5>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>الرقم</th>
                            <th>النوع</th>
                            <th>الموضوع</th>
                            <th>المرسل</th>
                            <th>المستلم</th>
                            <th>التاريخ</th>
                            <th>الملف</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="mailsTableBody">
                        <!-- يتم تعبئتها ديناميكياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // عرض تاريخ اليوم تلقائياً
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const todayStr = new Date().toLocaleDateString('ar-SY', options);
        document.getElementById('dateDisplay').innerHTML = `<i class="fas fa-calendar-alt ms-1"></i> ${todayStr}`;

        // دالة تسجيل الدخول
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadMails();
            } else {
                alert(data.error || 'خطأ في اسم المستخدم أو كلمة المرور');
            }
        }

        function logout() {
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        // جلب المعاملات وعرضها
        async function loadMails() {
            const res = await fetch('/api/mails');
            const mails = await res.json();
            const tbody = document.getElementById('mailsTableBody');
            tbody.innerHTML = '';
            mails.forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td>${m.mail_number || ''}</td>
                        <td><span class="badge bg-secondary">${m.mail_type || ''}</span></td>
                        <td>${m.subject || ''}</td>
                        <td>${m.sender_dept || ''}</td>
                        <td>${m.receiver_dept || ''}</td>
                        <td>${m.created_at ? m.created_at.split('T')[0] : ''}</td>
                        <td>${m.pdf_path ? `<a href="${m.pdf_path}" target="_blank" class="btn btn-sm btn-outline-danger"><i class="fas fa-file-pdf"></i> عرض</a>` : 'لا يوجد'}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="deleteMail(${m.id})"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `;
            });
        }

        // إضافة معاملة جديدة عبر الـ API
        async function addMail(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/api/mails', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                alert('تم الحفظ بنجاح');
                e.target.reset();
                loadMails();
            } else {
                alert('حدث خطأ أثناء الحفظ');
            }
        }

        // حذف معاملة
        async function deleteMail(id) {
            if (confirm('هل أنت متأكد من حذف هذه المعاملة؟')) {
                const res = await fetch(`/api/mails/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) loadMails();
                else alert('خطأ في الحذف');
            }
        }
    </script>
</body>
</html>
